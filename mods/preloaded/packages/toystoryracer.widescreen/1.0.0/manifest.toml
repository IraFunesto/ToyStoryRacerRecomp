format_version = 5
id = "toystoryracer.widescreen"
version = "1.0.0"
name = "Toy Story Racer Widescreen"
author = "ToyStoryRacerRecomp"
description = "Native-wide widescreen presentation for Disney-Pixar Toy Story Racer."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLES-03398"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Disabled by default. Renders a wider field of view instead of stretching the 4:3 picture. Menus and videos stay 4:3."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Fit follows the shape of the window, starting from 16:9. The other choices are fixed."
group = "Display"
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to window"

[[option.choice]]
value = "16-9"
label = "16:9"

[[option.choice]]
value = "21-9"
label = "21:9"

[[option.choice]]
value = "32-9"
label = "32:9"

[[option]]
feature = "widescreen"
id = "high_refresh_vsync"
label = "VSync on high-refresh monitors"
description = "Keeps vertical sync on when the monitor runs above 60 Hz (120/144/165 Hz), so fast motion does not tear. Game speed is unchanged. OpenGL renderer."
group = "Display"
type = "choice"
default = "on"

[[option.choice]]
value = "on"
label = "On"

[[option.choice]]
value = "off"
label = "Off"

[[option]]
feature = "widescreen"
id = "hud_size"
label = "HUD size"
description = "Draws the race progress bar smaller so its low-resolution art looks sharper. 100% is the original size."
group = "Display"
type = "choice"
default = "85"

[[option.choice]]
value = "100"
label = "100%"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75%"

[[option.choice]]
value = "65"
label = "65%"

[[option]]
feature = "widescreen"
id = "cpu_overclock"
label = "CPU overclock"
description = "Gives the emulated CPU more time per frame, like DuckStation's CPU overclock. With the native scenery renderer the game needs little: 150% keeps two-player races at full rate, and high values only cost host CPU time (above about 300% the game can even run slow). The higher values are for the original renderer. Active only during races (menus run at the normal 100%). Game speed and music are unchanged."
group = "Display"
type = "choice"
default = "150"

[[option.choice]]
value = "100"
label = "Off (100%)"

[[option.choice]]
value = "150"
label = "150%"

[[option.choice]]
value = "300"
label = "300%"

[[option.choice]]
value = "500"
label = "500%"

[[option.choice]]
value = "700"
label = "700%"

[[option]]
feature = "widescreen"
id = "track_detail"
label = "Track draw distance"
description = "The game hides track pieces that are far away or that its per-area visibility list (made for the 4:3 view) does not expect to be seen, so in a wide view scenery can pop in at the horizon and at the sides. Extended doubles the draw distance; Full also ignores the visibility list. Both draw more and are best used with the CPU overclock."
group = "Display"
type = "choice"
default = "full"

[[option.choice]]
value = "original"
label = "Original"

[[option.choice]]
value = "extended"
label = "Extended"

[[option.choice]]
value = "full"
label = "Full"

[[option]]
feature = "widescreen"
id = "polygon_pool"
label = "Near-polygon pool (experimental)"
description = "Experimental. The game splits polygons close to the camera into pieces from a fixed pool of 2500; the wider view needs about twice as many, and when the pool runs out nearby ground turns black or its textures swim for a moment. Standard keeps the game's own memory (2300 pieces); Expanded raises the pool to 4600 using the 8 MB RAM mode. Save states made with one setting do not load with the other."
group = "Display"
type = "choice"
default = "standard"

[[option.choice]]
value = "standard"
label = "Standard (2300)"

[[option.choice]]
value = "expanded"
label = "Expanded (4600, 8 MB RAM)"

[[option]]
feature = "widescreen"
id = "frame_smoothing"
label = "Frame smoothing"
description = "The game draws 25 frames per second. Blend crossfades between them up to your monitor's refresh rate, so motion looks smoother; large changes cut cleanly to avoid trails. Presentation only: game speed and music are unchanged. OpenGL renderer."
group = "Display"
type = "choice"
default = "off"

[[option.choice]]
value = "off"
label = "Off"

[[option.choice]]
value = "blend"
label = "Blend"

[[option]]
feature = "widescreen"
id = "skip_videos"
label = "Skip videos"
description = "Skips the intro movies (and other videos) as soon as they start, so the game reaches the menus quickly."
group = "Display"
type = "choice"
default = "on"

[[option.choice]]
value = "on"
label = "On"

[[option.choice]]
value = "off"
label = "Off"

[[option]]
feature = "widescreen"
id = "native_scenery"
label = "Native scenery renderer"
description = "Draws the track scenery on the PC in full precision instead of the PlayStation pipeline: no vertex wobble or texture warping, no near-camera clipping or polygon pool limits, with a real depth buffer (objects behind walls stay hidden). Karts, pick-ups and the HUD still come from the game. OpenGL renderer."
group = "Display"
type = "choice"
default = "on"

[[option.choice]]
value = "off"
label = "Off"

[[option.choice]]
value = "on"
label = "On"

[[option]]
feature = "widescreen"
id = "frame_rate"
label = "Frame rate in races"
description = "The game draws 25 frames per second. '50 fps (1 player)' draws a new frame every VBlank in one-player races (the game is time-based, so its speed and the music are unchanged); when a frame needs more time it simply falls back to 25 for that moment. '50 fps (also 2 players)' does the same in two-player races too: it needs a fast PC, best with internal resolution 960 and CPU overclock 150; menus stay at 25. Best with the native scenery renderer."
group = "Display"
type = "choice"
default = "50"

[[option.choice]]
value = "25"
label = "25 fps (original)"

[[option.choice]]
value = "50"
label = "50 fps (1 player)"

[[option.choice]]
value = "50_2p"
label = "50 fps (also 2 players)"

[[option]]
feature = "widescreen"
id = "music_change"
label = "Music change hitch fix"
description = "When the race music changes, the game waits for the CD drive to stop, which takes about two frames and shows as a small hitch (about two seconds into a race). Smooth answers that wait at once. Original keeps the hardware timing."
group = "Display"
type = "choice"
default = "smooth"

[[option.choice]]
value = "smooth"
label = "Smooth"

[[option.choice]]
value = "original"
label = "Original"

[[option]]
feature = "widescreen"
id = "minimap_position"
label = "Race progress bar position"
description = "Moves the race progress bar (the rope with the racers' faces) closer to the bottom edge, so it covers less of the track."
group = "Display"
type = "choice"
default = "lower"

[[option.choice]]
value = "original"
label = "Original"

[[option.choice]]
value = "lower"
label = "Lower"

[[plugin]]
feature = "widescreen"
id = "toystoryracer.widescreen"


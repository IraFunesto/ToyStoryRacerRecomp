# Track draw distance. "full" (doubled distance, per-area visibility bitmaps
# ignored) is compiled into the game code (game.toml [[recompiler.patch]]),
# because the object-list builders run every frame and a RAM patch would
# send them through the interpreter (a hitch whenever the camera turns).
# "original" and "extended" are RAM patches that put the stock behaviour back
# with a second encoding of the same instruction (addiu -> ori, beq rs/rt
# swapped), so they differ from the stock image and run interpreted.

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80010174
expected = "60 00 13 3c"
replace = "5f 00 13 3c"        # lui s3,0x5F (stock 0x60; lui has no second encoding)
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80010474
expected = "80 c1 28 21"
replace = "80 c1 28 25"        # addiu t0,t1,-16000 (= stock addi)
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80010114
expected = "f6 ff 20 13"
replace = "f6 ff 19 10"        # beq zero,t9,skip (= stock beq t9,zero)
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80010418
expected = "f6 ff 20 13"
replace = "f6 ff 19 10"        # beq zero,t9,skip
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x8004C384
expected = "d0 07 04 24"
replace = "d0 07 04 34"        # ori a0,zero,2000 (= stock addiu)
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x8004C3B0
expected = "af 04 02 24"
replace = "af 04 02 34"        # ori v0,zero,1199
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x8004C360
expected = "d0 07 03 24"
replace = "d0 07 03 34"        # ori v1,zero,2000
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x8004C364
expected = "ac 0d 03 24"
replace = "ac 0d 03 34"        # ori v1,zero,3500
when = { track_detail = "original" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80010114
expected = "f6 ff 20 13"
replace = "f6 ff 19 10"        # beq zero,t9,skip (keep the visibility bitmaps)
when = { track_detail = "extended" }

[[patch]]
feature = "widescreen"
target = "main_exe"
address = 0x80010418
expected = "f6 ff 20 13"
replace = "f6 ff 19 10"        # beq zero,t9,skip (keep the visibility bitmaps)
when = { track_detail = "extended" }


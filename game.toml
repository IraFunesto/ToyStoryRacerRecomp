# Frame wait loop: the main loop polls the VBlank counter between
# ExitCriticalSection/EnterCriticalSection syscalls. Each syscall is an
# exception on the host, so with the CPU overclock this idle spin used most of
# a host core (and starved the native scenery renderer's frames). Polling the
# counter without the syscalls is equivalent for the game.
[[recompiler.patch]]
id = "wait-8007292C"
address = "0x8007292C"
expected = "0x0C0237D2"
replacement = "0x00000000"
note = "frame wait loop: no ExitCriticalSection syscall"

[[recompiler.patch]]
id = "wait-80072934"
address = "0x80072934"
expected = "0x0C0237CE"
replacement = "0x3C019F00"
note = "frame wait loop: no EnterCriticalSection syscall; lui at,0x9F00 (frame-rate word)"

# Frame rate option: the main loop waits until the VBlank counter reaches 2
# (25 fps on PAL); the game is delta-timed (delta = counter, clamp 4), so a
# threshold of 1 gives 50 fps at the same game speed. The threshold comes
# from the widescreen plugin's first mod-memory word (0x9F000000): threshold
# = word + 3, the plugin stores -1 (25 fps) or -2 (50 fps). An unallocated
# word reads as open bus (-1), so without the plugin the game keeps 25 fps.
[[recompiler.patch]]
id = "fps-80072938"
address = "0x80072938"
expected = "0x00000000"
replacement = "0x8C210000"
note = "frame wait loop: lw at,0(at) (frame-rate word)"

[[recompiler.patch]]
id = "fps-80072944"
address = "0x80072944"
expected = "0x00000000"
replacement = "0x24210003"
note = "frame wait loop: addiu at,at,3 (threshold = word + 3)"

[[recompiler.patch]]
id = "fps-80072948"
address = "0x80072948"
expected = "0x28420002"
replacement = "0x0041102A"
note = "frame wait loop: slt v0,v0,at (was slti v0,v0,2)"

